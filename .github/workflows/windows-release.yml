name: Windows Release (Tauri)

on:
  release:
    types:
      - published

jobs:
  build-release-windows:
    name: Build and attach release artifacts (windows-latest)
    runs-on: windows-latest

    permissions:
      contents: write # needed to upload release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Set package versions from release tag
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          Write-Output "Setting versions to $env:TAG"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version=process.env.TAG;fs.writeFileSync('package.json',JSON.stringify(p,null,2));console.log('package.json version set to',process.env.TAG);"
          node -e "const fs=require('fs');const path='src-tauri/Cargo.toml';let s=fs.readFileSync(path,'utf8');let i=s.indexOf('[package]'); if(i===-1){console.error('no [package] section'); process.exit(0);} let rest=s.slice(i); let newrest=rest.replace(/version\s*=\s*\x22.*\x22/,'version = \x22'+process.env.TAG+'\x22'); s=s.slice(0,i)+newrest; fs.writeFileSync(path,s); console.log('Cargo.toml version set to',process.env.TAG);"
          Write-Output "Updated files preview:"; Get-Content package.json | Select-Object -First 20; Write-Output "---"; Get-Content src-tauri/Cargo.toml | Select-Object -First 20

      - name: Build and copy bootstrapper
        shell: pwsh
        run: |
          .\scripts\build_and_copy_bootstrapper.ps1

      - name: Install dependencies (yarn)
        shell: pwsh
        run: |
          yarn install --frozen-lockfile

      - name: Build frontend (vite)
        shell: pwsh
        run: |
          yarn build

      - name: Build Tauri (Windows)
        shell: pwsh
        run: |
          yarn tauri build

      - name: Collect bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item -Path src-tauri/target/release/bundle/* -Destination release-artifacts -Recurse -Force
          Get-ChildItem -Path release-artifacts -Recurse

      - name: Upload release artifacts to the published release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPLOAD_URL: ${{ github.event.release.upload_url }}
        run: |
          # Trim the templated portion of the upload_url ("{?name,label}")
          $uploadUrlBase = $env:UPLOAD_URL -replace '\{\?.*\}$',''
          Write-Output "Uploading assets to $uploadUrlBase"
          $files = Get-ChildItem -Path release-artifacts -Recurse -File
          if (-not $files) { Write-Output "No artifacts found to upload"; exit 0 }
          foreach ($f in $files) {
            $name = $f.Name
            $uri = "$uploadUrlBase?name=$name"
            Write-Output "Uploading $($f.FullName) as $name"
            try {
              $bytes = [System.IO.File]::ReadAllBytes($f.FullName)
              Invoke-RestMethod -Uri $uri -Method Post -Headers @{ Authorization = "token $env:GITHUB_TOKEN" } -Body $bytes -ContentType 'application/octet-stream'
            } catch {
              Write-Error "Failed to upload $name: $_"
              exit 2
            }
          }
