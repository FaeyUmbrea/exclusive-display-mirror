name: Windows Release (Tauri)

on:
  release:
    types:
      - published

jobs:
  build-release-windows:
    name: Build and attach release artifacts (windows-latest)
    runs-on: windows-latest

    permissions:
      contents: write # needed to upload release assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Set package versions from release tag
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/set_version.js
          Write-Output "Updated files preview:"; Get-Content package.json | Select-Object -First 20; Write-Output "---"; Get-Content src-tauri/Cargo.toml | Select-Object -First 20

      - name: Build and copy bootstrapper
        shell: pwsh
        run: |
          .\scripts\build_and_copy_bootstrapper.ps1

      - name: Install dependencies (yarn)
        shell: pwsh
        run: |
          yarn install --frozen-lockfile

      - name: Build frontend (vite)
        shell: pwsh
        run: |
          yarn build

      - name: Build Tauri (Windows)
        shell: pwsh
        run: |
          yarn tauri build

      - name: Collect bundles
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts
          Copy-Item -Path src-tauri/target/release/bundle/* -Destination release-artifacts -Recurse -Force
          Get-ChildItem -Path release-artifacts -Recurse

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release-artifacts -Recurse -File | Select-Object -ExpandProperty FullName
          if ($files) {
            Write-Output "Uploading files: $files"
            gh release upload $env:TAG $files --clobber
          } else {
            Write-Warning "No artifacts found to upload."
          }
