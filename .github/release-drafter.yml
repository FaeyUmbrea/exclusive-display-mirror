name-template: '$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: "Added"
    labels:
      - "feature"
      - "enhancement"
      - "added"
  - title: "Changed"
    labels:
      - "changed"
      - "improvement"
  - title: "Fixed"
    labels:
      - "fix"
      - "bug"
  - title: "Deprecated"
    labels:
      - "deprecated"
  - title: "Removed"
    labels:
      - "removed"
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - 'major'
  minor:
    labels:
      - 'minor'
  patch:
    labels:
      - 'patch'
  default: patch
exclude-labels:
  - 'skip-changelog'
template: |
  ## Changes

  $CHANGES
