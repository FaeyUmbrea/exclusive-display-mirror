[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

default-run = "tauri-app"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.9.3", features = [] }
tauri-plugin-opener = "2.5.2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
libobs-sources = "3.3.0"
lazy_static = "1.5.0"
env_logger = "0.11.8"
libobs-wrapper = { version = "5.3.0", features = ["no_blocking_drops"] }
libobs = "3.0.1"
log = "0.4.28"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Devices", "Win32_Graphics_Dxgi_Common", "Devices", "Foundation", "Devices_Display", "Foundation_Collections", "Devices_Display_Core", "Graphics", "Foundation_Numerics", "Graphics_DirectX", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Direct3D", "Win32_System_WinRT_Display", "Graphics_DirectX_Direct3D11", "Win32_System_WinRT", "Win32_UI_Shell"] }
windows-core = "0.62.2"
windows-collections = "0.3.2"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }

